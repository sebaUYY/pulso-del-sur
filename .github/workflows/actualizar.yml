name: Actualizar Pulso del Sur

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 18:30 Uruguay, después del cierre de las fuentes
    - cron: "0 12 * * *"      # 09:00 Uruguay, para recoger datos publicados de madrugada
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5
      - name: Descargar datos
        run: python fetch.py
      - name: Armar sitio y archivos
        run: |
          python build.py
          python export.py
          cp data.json site/datos/data.json
      - name: Radar de compras públicas
        continue-on-error: true
        run: python licitaciones.py
      - name: Páginas fijas
        run: cp -r static/. site/
      - name: Guardar cache del radar
        continue-on-error: true
        run: |
          git config user.name "pulso-bot"
          git config user.email "pulso-bot@users.noreply.github.com"
          git add licitaciones/cache.json
          git diff --cached --quiet || (git commit -m "Actualizar cache del radar" && git push)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
