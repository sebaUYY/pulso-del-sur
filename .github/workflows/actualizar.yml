name: Actualizar Pulso del Sur

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 18:30 Uruguay, después del cierre de las fuentes
    - cron: "0 12 * * *"      # 09:00 Uruguay, para recoger datos publicados de madrugada
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5
      - name: Descargar datos
        run: python fetch.py
      - name: Armar sitio y archivos
        run: |
          python build.py
          python export.py
          cp data.json site/datos/data.json
      - name: Radar de compras públicas
        continue-on-error: true
        run: python licitaciones.py
      - name: Empleos públicos (Uruguay Concursa)
        continue-on-error: true
        run: python concursa.py
      - name: Canasta UY (solo descarga si Defensa del Consumidor publicó un archivo nuevo)
        continue-on-error: true
        timeout-minutes: 40
        run: python canasta_site.py
      - name: Feriados, sismos y visas LatAm
        continue-on-error: true
        run: python latam.py
      - name: Importá Fácil (arancel y compras del Estado; se recalcula el día 1 de cada mes)
        continue-on-error: true
        timeout-minutes: 30
        run: |
          if [ ! -f impo/ncm.json ] || [ "$(date +%d)" = "01" ]; then python impo.py --auto; fi
          mkdir -p site/importar && cp impo/*.json site/importar/
      - name: Remates judiciales (IMPO)
        continue-on-error: true
        timeout-minutes: 10
        run: python remates.py
      - name: Abrí tu negocio (catálogo de trámites)
        continue-on-error: true
        timeout-minutes: 10
        run: python hab.py
      - name: Sucesiones y herencias (Diario Oficial)
        continue-on-error: true
        timeout-minutes: 15
        run: |
          pip install pymupdf==1.24.10
          python sucesiones.py
      - name: Consejos de Salarios (IMPO)
        continue-on-error: true
        timeout-minutes: 15
        run: python salarios.py
      - name: Páginas fijas
        run: cp -r static/. site/
      - name: Guardar cache del radar
        continue-on-error: true
        run: |
          git config user.name "pulso-bot"
          git config user.email "pulso-bot@users.noreply.github.com"
          git add licitaciones/cache.json
          git add canasta/resumen-*.json canasta/stamp.txt 2>/dev/null || true
          git add impo/*.json 2>/dev/null || true
          git add remates/historico.json 2>/dev/null || true
          git add sucesiones/historico.json 2>/dev/null || true
          git add salarios/cache.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Actualizar caches" && git push)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
